[package]
name = "metroskool-monitor-desktop"
version = "0.1.0"
description = "Metroskool Monitor Windows attendance shell (Tauri 2)"
authors = ["Altrastate Technologies"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "metroskool_monitor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
metroskool_desktop_core = { path = "../../../crates/metroskool_desktop_core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
