name: metroskool_monitor_offline
description: >
  Metroskool Monitor Android app with an encrypted, idempotent attendance queue.
  Supabase remains authoritative. Not part of the pnpm workspace.
version: 0.0.1+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  metroskool_flutter_core:
    path: ../packages/flutter_core

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  lints: ^5.1.1
  test: ^1.25.15

flutter:
  uses-material-design: true
